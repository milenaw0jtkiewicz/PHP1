<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Tworzenie nowego elementu HTML</h1>
<script>
    //tworzenei nwoego elementu paragrafu
    let newElement = document.createElement("p");
    //dodanie zawartosci (content) do nowego elementu
    newElement.textContent = "tj nowy paragraf";
    //dodanie nowego elementu do ciala dokumentu
    document.body.appendChild(newElement);
</script>
</body>
</html>
